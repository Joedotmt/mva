name: Deploy website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Check Svelte and TypeScript
        working-directory: web
        run: npm run check
      - name: Build public website
        working-directory: web
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - name: Verify exported website
        working-directory: web
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run verify
      - name: Install test browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile behavior
        working-directory: web
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm test
      - name: Prepare site
        run: |
          mkdir -p _site/portal
          cp -a web/build/. _site/
          cp -a app/. _site/portal/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
