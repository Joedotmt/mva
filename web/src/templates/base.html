<!doctype html>
<html class="no-js" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{description}}">
  <title>{{title}}</title>
  <link rel="canonical" href="{{canonical_url}}">
  <link rel="icon" type="image/png" href="{{site_root}}/assets/images/shared/favicon.png">
  <script src="{{site_root}}/assets/js/head.js"></script>
  <link rel="stylesheet" href="{{site_root}}/assets/css/site.css">
  <script src="{{site_root}}/assets/js/site.js" defer></script>
</head>
<body class="{{body_class}}">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <a class="skip-link skip-link--navigation" href="#primary-navigation">Skip to navigation</a>
  {{header}}
  <main id="main-content" tabindex="-1">
    {{content}}
  </main>
  {{footer}}
</body>
</html>
